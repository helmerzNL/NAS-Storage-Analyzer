name: Bug report
description: Something isn't working in NAS Storage Analyzer
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check whether an
        [existing issue](https://github.com/helmerzNL/NAS-Storage-Analyzer/issues?q=is%3Aissue)
        already covers this problem.

  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the problem briefly and concretely.
      placeholder: Opening the main screen shows a blank page.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see this happen ourselves?
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web interface (browser)
        - REST API
        - Scanner / worker
        - Docker deployment
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Output of `docker compose exec app nasa version`, or the image tag.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system / browser
      placeholder: "Debian 12 / Docker 27 / Chrome 140"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any relevant console output. This is automatically formatted as code.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help explain the problem.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing reports of this bug
          required: true
        - label: I am running the latest version of the app
          required: false
