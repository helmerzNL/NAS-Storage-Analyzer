name: agent-instructions

on:
  pull_request:
    branches:
      - beta
      - main

jobs:
  # `agent-instructions-lint` has its own job so that its name can be found on the pull request:
  # baseline §17 cites it as `[Control: agent-instructions-lint]`, and a control that cannot be
  # found under the name a document cites it by is not a control.
  agent-instructions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The validator's own tests first: if the script fails, you want to know whether the script
      # is broken or the documents are.
      - name: Test the agent-instructions validator
        run: python -m unittest discover -s scripts -p "test_check_agent_instructions.py" -v
      - name: Validate the agent instruction surfaces
        run: python scripts/check_agent_instructions.py
      # The README is the other document that every client and every newcomer reads first, so it is checked here too
      # (both languages, the same structure, every link, anchor and picture) instead of in a twelfth check.
      - name: The READMEs (Dutch and English) agree and point at things that exist
        run: python -m unittest discover -s scripts -p "test_readme.py" -v
