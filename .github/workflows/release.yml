# Rules: project-baseline.md §5 (App-Guidance shared/templates/github/workflows/release.yml).
#
# One workflow cuts every release, and it is the only thing that creates a version tag:
# `gh release create` makes the tag and the GitHub Release in one call, so a version tag
# without a GitHub Release cannot come out of it. The notes are a reviewed file in the
# repository, required before anything is tagged.
#
#   production  from main, tag vX.Y.Z,        a normal release marked --latest
#   beta        from beta, tag vX.Y.Z-beta.N, a prerelease, never --latest
#
# An app that has only a production release deletes the `beta` option, the beta branch
# and the beta branch of the "Resolve the tag" step. X.Y.Z comes from VERSION, the
# single source of truth; N counts the betas already cut for that version.
#
# A moving channel tag (`beta`, `stable`, `latest`) is not a release and is not created here.

name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which release to cut
        type: choice
        options:
          - production
          - beta
        default: production

concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION_FILE: VERSION        # a plain file holding MAJOR.MINOR.PATCH, e.g. VERSION or app/VERSION
  PROD_BRANCH: main          # e.g. main
  BETA_BRANCH: beta          # e.g. beta; delete with the beta option if there is none

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Guard the branch matches the channel
        run: |
          if [[ "${{ inputs.channel }}" == "beta" ]]; then WANT="${BETA_BRANCH}"; else WANT="${PROD_BRANCH}"; fi
          if [[ "${GITHUB_REF}" != "refs/heads/${WANT}" ]]; then
            echo "::error::A ${{ inputs.channel }} release must be run from '${WANT}' (got '${GITHUB_REF_NAME}')."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve the tag
        id: tag
        run: |
          VERSION="$(tr -d '[:space:]' < "${VERSION_FILE}")"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${VERSION_FILE} '${VERSION}' is not a MAJOR.MINOR.PATCH semver."
            exit 1
          fi
          git fetch --tags --quiet
          if [[ "${{ inputs.channel }}" == "beta" ]]; then
            # A beta leads up to a version that is not yet released.
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
              echo "::error::v${VERSION} is already released; bump ${VERSION_FILE} before cutting another beta."
              exit 1
            fi
            LAST="$(git tag --list "v${VERSION}-beta.*" | sed 's/.*-beta\.//' | sort -n | tail -1)"
            TAG="v${VERSION}-beta.$(( ${LAST:-0} + 1 ))"
            FLAGS="--prerelease"
          else
            TAG="v${VERSION}"
            FLAGS="--latest"
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists. A version tag is never written twice; bump ${VERSION_FILE}."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "flags=${FLAGS}" >> "$GITHUB_OUTPUT"
          echo "notes_file=docs/releases/${TAG}.md" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} from $(git rev-parse HEAD)"

      - name: Guard the release notes exist
        env:
          NOTES_FILE: ${{ steps.tag.outputs.notes_file }}
        run: |
          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "::error file=${NOTES_FILE}::Release notes ${NOTES_FILE} are missing. Write and review them (template: RELEASE_NOTE_TEMPLATE.md) and commit them before releasing."
            exit 1
          fi

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          FLAGS: ${{ steps.tag.outputs.flags }}
          NOTES_FILE: ${{ steps.tag.outputs.notes_file }}
        run: |
          gh release create "${TAG}" \
            --target "$(git rev-parse HEAD)" \
            --title "NAS Storage Analyzer ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            ${FLAGS}
      # No publish workflow is dispatched here, on purpose. Images are built when a branch moves, not from a tag:
      # publish.yml pushes `latest` and the version tag `X.Y.Z` when a promotion lands (and only while this tag did
      # not exist yet), publish-beta.yml pushes `beta` and `beta-<sha>`. A tag created with GITHUB_TOKEN would start
      # no `on: push: tags` workflow anyway; if one is ever needed, dispatch it here with `gh workflow run`, which
      # does start a run (and needs `actions: write` in the permissions above).
