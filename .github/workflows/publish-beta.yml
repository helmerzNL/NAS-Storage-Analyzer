# Rules: project-baseline.md §20 (a new app starts on beta and main). docs/adr/0002-beta-main-promotion.md.
#
# Every push to beta builds the beta image for linux/amd64 and linux/arm64. `beta` is a channel tag and moves on every
# build; `beta-<sha>` names one build. It never writes a stable tag (`latest`, `X.Y.Z`), never touches VERSION and never
# creates a GitHub Release: main does that, after a promotion (publish.yml, release.yml).
name: publish-beta

on:
  push:
    branches:
      - beta

concurrency:
  group: publish-beta
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3             # to build the arm64 half of the image on this amd64 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64    # one tag, one manifest list: every host pulls the half that fits
          cache-from: type=gha,scope=beta
          cache-to: type=gha,scope=beta,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:beta
            ${{ steps.image.outputs.name }}:beta-${{ github.sha }}
