# Rules: project-baseline.md §20 (a new app starts on beta and main). docs/adr/0002-beta-main-promotion.md.
#
# Every push to beta builds the beta image for linux/amd64 and linux/arm64, and the all-in-one image `-aio` on it
# (deploy/aio, docs/adr/0013-all-in-one-image.md). `beta` is a channel tag and moves on every build; `beta-<sha>` names one build. It never writes a stable tag (`latest`, `X.Y.Z`), never touches VERSION and never
# creates a GitHub Release: main does that, after a promotion (publish.yml, release.yml).
name: publish-beta

on:
  push:
    branches:
      - beta

concurrency:
  group: publish-beta
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      # To build the arm64 half of the image on this amd64 runner
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # What is in the image and how it was built travel with it: a software bill of materials and a build provenance record,
          # attached in the registry (`docker buildx imagetools inspect <image> --format '{{json .SBOM}}'`). They are not signed.
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64    # one tag, one manifest list: every host pulls the half that fits
          cache-from: type=gha,scope=beta
          cache-to: type=gha,scope=beta,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:beta
            ${{ steps.image.outputs.name }}:beta-${{ github.sha }}
      # The all-in-one image (PostgreSQL, serve and worker in one container, for Unraid and Home Assistant; docs/adr/0013), built on
      # the very image pushed above, by digest, so both carry the same binary.
      - name: Build and push the all-in-one image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: deploy/aio
          push: true
          # What is in the image and how it was built travel with it: a software bill of materials and a build provenance record,
          # attached in the registry (`docker buildx imagetools inspect <image> --format '{{json .SBOM}}'`). They are not signed.
          sbom: true
          provenance: mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
            CHANNEL=beta
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}-aio:beta
            ${{ steps.image.outputs.name }}-aio:beta-${{ github.sha }}
