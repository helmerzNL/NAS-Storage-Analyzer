name: ci

on:
  pull_request:
    branches:
      - beta
      - main
  # beta is where changes land, so its state has to be checked too: a promotion starts from "CI on beta is green".
  push:
    branches:
      - beta

permissions:
  contents: read

env:
  # The vulnerability scanner for the images (Anchore grype), by digest: a tag can be moved, a digest cannot. Raised by hand; its
  # database of advisories is downloaded fresh on every run, so an older scanner still knows today's advisories.
  GRYPE_IMAGE: ghcr.io/anchore/grype:v0.121.3@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887

jobs:
  # What we build on (docs/app-engineering-conformance.md, topics 67 and 108): no known vulnerability that our code can reach, no
  # high or critical advisory in the npm packages, no secret in the repository or its history, and a Go line that go.mod and the
  # Dockerfile agree on. The tools are Go modules run at a fixed version, so the Go checksum database vouches for them and no extra
  # action is trusted. The images themselves are scanned where they are built (`docker-build`, `aio-image`), and the weekly workflow
  # `supply-chain` repeats all of this without a push, because an advisory or an end-of-life date arrives on its own schedule.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # the secret scan reads every commit, not only the last one
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: No known vulnerability is reachable from the Go code (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: No high or critical advisory in the npm packages, build tools included (npm audit)
        working-directory: web
        run: npm audit --audit-level=high
      - name: No secret in the repository or its history (gitleaks)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-level warn .
      - name: The base-image check itself, and that go.mod and the Dockerfile name the same Go line
        run: |
          python -m unittest discover -s scripts -p "test_check_base_images.py" -v
          python scripts/check_base_images.py --offline

  go-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NASSA_TEST_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      NASSA_REQUIRE_DB: "1"      # a database test that cannot run fails instead of skipping
      NASSA_REQUIRE_SHELLS: sh,dash,bash,bash-posix   # same for the shells the delete-script tests run scripts in
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # A skipped test is a missing control, so fail if any test was skipped.
      - name: Run the tests with the race detector
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... | tee /tmp/gotest.out
          ! grep -q -- "--- SKIP" /tmp/gotest.out

  web-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx vitest run
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the interface and the binary
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          go build -ldflags "-X main.version=0.1.0" -o nasa ./cmd/nasa   # a numeric version: the update check has something to compare
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
      - name: Run the whole application in a real browser
        env:
          SHOTS: ${{ runner.temp }}/e2e-shots
        run: sh web/e2e/run.sh ./nasa postgres://postgres:test@127.0.0.1:5432
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

  # Where the data lives and which image runs (baseline sections 20 and 21): the Compose file and .env.example are
  # read as text, init-env.sh and migrate_data.sh are driven with a fake docker. Fast, needs no database.
  deploy-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compose layout, init-env.sh and migrate_data.sh
        run: python -m unittest discover -s scripts -p "test_deploy_layout.py" -v

  # The delete scripts (internal/delscript) are run for real, in the shell they are written for, against files with the
  # names that break scripts. cmd.exe and Windows PowerShell 5.1 only exist on Windows, and the BSD stat of macOS is
  # what the sh script has to cope with there, so this cannot be proven on one operating system. The package needs
  # no database. A shell that is missing fails the job (NASSA_REQUIRE_SHELLS) and so does a skipped test.
  delete-script-shells:
    name: delete-script-shells (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: sh,dash,bash,bash-posix
          - os: macos-latest
            shells: sh,bash,bash-posix
          - os: windows-latest
            shells: pwsh
    env:
      NASSA_REQUIRE_SHELLS: ${{ matrix.shells }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/delscript/
      - name: Run the scripts in the real shells
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/delscript/ | tee "$RUNNER_TEMP/delscript.out"
          ! grep -q -- "--- SKIP" "$RUNNER_TEMP/delscript.out"

  aio-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The start script passes shellcheck
        run: shellcheck deploy/aio/nasa-aio deploy/aio/smoke-test.sh
      - name: Build the image and the all-in-one image on it
        run: |
          docker build --build-arg VERSION=ci -t nas-storage-analyzer:ci .
          docker build --build-arg BASE=nas-storage-analyzer:ci --build-arg CHANNEL=beta -t nas-storage-analyzer-aio:ci-beta deploy/aio
          docker build --build-arg BASE=nas-storage-analyzer:ci --build-arg CHANNEL=latest -t nas-storage-analyzer-aio:ci-latest deploy/aio
      - name: The all-in-one image starts, stops, keeps and takes over its data (beta channel)
        run: sh deploy/aio/smoke-test.sh nas-storage-analyzer-aio:ci-beta beta
      - name: The all-in-one image has no known vulnerability of high or critical severity that has a fix
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$GRYPE_IMAGE" docker:nas-storage-analyzer-aio:ci-beta --only-fixed --fail-on high
      - name: The stable all-in-one image reports the stable channel
        run: |
          key="$(docker run --rm nas-storage-analyzer-aio:ci-latest genkey)"
          docker run -d --name aio-stable -p 18090:8080 -e NASSA_ENCRYPTION_KEY="$key" nas-storage-analyzer-aio:ci-latest
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:18090/readyz >/dev/null && break; sleep 1; done
          version="$(curl -s http://127.0.0.1:18090/api/v1/version)"
          docker rm -f aio-stable
          grep -q '"channel":"stable"' <<<"$version" || { echo "::error::the stable all-in-one image reports $version"; exit 1; }

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build --build-arg VERSION=ci -t nas-storage-analyzer:ci .
      - name: The binary in the image starts and reports its version
        run: docker run --rm nas-storage-analyzer:ci version
      - name: The image has no known vulnerability of high or critical severity that has a fix
        run: |
          # Operating-system packages, the Go standard library and the Go modules in the binary. "That has a fix" (--only-fixed): a
          # finding nobody can act on yet does not block a pull request; the weekly workflow lists those too.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$GRYPE_IMAGE" docker:nas-storage-analyzer:ci --only-fixed --fail-on high
      - name: The binary refuses to start with an old NASA_ variable
        run: |
          # Compose does not forward an old name to the container, but a process started without Compose (docker run, systemd) can still have one.
          set +e
          out="$(docker run --rm -e NASA_TAG=beta nas-storage-analyzer:ci serve 2>&1)"; code=$?
          set -e
          if [ "$code" != 2 ] || ! grep -q "NASA_TAG is now NASSA_TAG" <<<"$out"; then echo "::error::exit $code, and said: $out"; exit 1; fi
      - name: Compose refuses to start without DATA_PATH or the shares folder
        run: |
          rm -f .env
          for var in DATA_PATH NASSA_SHARES_DIR; do
            grep -v "^$var=" .env.example > .env
            if docker compose config -q 2>compose.err; then echo "::error::compose started without $var"; exit 1; fi
            grep -q "$var" compose.err || { echo "::error::compose failed, but not on $var:"; cat compose.err; exit 1; }
          done
          rm -f .env compose.err
      - name: Compose refuses an .env that still has the old NASA_ names
        run: |
          # The variables were called NASA_* before NASSA_* (docs/adr/0012). Compose passes on only what it lists, so an old .env reads as "nothing
          # set"; the required NASSA_SHARES_DIR refuses it, and the message says what to do.
          sed 's/^NASSA_/NASA_/' .env.example > .env
          if docker compose config -q 2>compose.err; then echo "::error::compose started with an .env that has the old names"; exit 1; fi
          grep -q "sed -i 's/^NASA_/NASSA_/' .env" compose.err || { echo "::error::compose refused the old names, but without saying to rename them:"; cat compose.err; exit 1; }
          rm -f .env compose.err
      - name: Compose files are valid for the example env
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.mounts.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.mounts.yml config -q
      - name: mount.cifs gets past its capability step with what the mounts override gives the worker
        run: |
          # mount.cifs sets its own capabilities at start-up and asks for SYS_ADMIN, DAC_READ_SEARCH and DAC_OVERRIDE; when the container lacks
          # one it stops before mounting, with "Unable to apply new capability set." (older cifs-utils: "Unable to set current process capabilities"). The worker drops every
          # capability, so the override must add all three back. The flags are read from the merged Compose file, so this proves the override as
          # shipped. There is no SMB server here: the question is only whether mount.cifs gets past that step, so what it says after that
          # (no cifs support, AppArmor, connection refused) does not matter.
          cp .env.example .env
          flags="$(docker compose -f docker-compose.yml -f docker-compose.mounts.yml config --format json \
            | jq -r '.services.worker | ((.cap_drop // []) | map("--cap-drop " + .)) + ((.cap_add // []) | map("--cap-add " + .)) + ((.security_opt // []) | map("--security-opt " + .)) | join(" ")')"
          rm -f .env
          echo "the worker's flags: $flags"
          cifs() { docker run --rm --user 0:0 "$@" --entrypoint sh nas-storage-analyzer:ci -c 'mkdir -p /tmp/m && timeout 30 mount -t cifs -o ro,guest //127.0.0.1/none /tmp/m 2>&1' || true; }
          stops='unable to (set current process capabilities|apply new capability set)'
          out="$(cifs $flags)"
          if grep -Eiq "$stops" <<<"$out"; then echo "::error::mount.cifs still stops on its capabilities with the worker's flags: $out"; exit 1; fi
          # The same probe must see the failure with a set that lacks one, or it proves nothing (and a newer cifs-utils that asks for less
          # would make the documentation and the override stale).
          for lacking in "--cap-add SYS_ADMIN" "--cap-add SYS_ADMIN --cap-add DAC_READ_SEARCH"; do
            out="$(cifs --cap-drop ALL $lacking)"
            grep -Eiq "$stops" <<<"$out" || { echo "::error::mount.cifs did not stop on its capabilities with --cap-drop ALL $lacking: $out"; exit 1; }
          done
      - name: The Docker-secrets variant is valid
        run: |
          rm -f .env
          sh scripts/init-env.sh --secrets
          docker compose -f docker-compose.yml -f docker-compose.secrets.yml config -q
      # Last, on purpose: setting up buildx makes `docker build` stop loading images into the local daemon.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: The image also builds for arm64 (Raspberry Pi, Apple silicon); publishing builds both
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ci-arm64
          cache-to: type=gha,scope=ci-arm64,mode=max
