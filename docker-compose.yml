# NAS Storage Analyzer: web interface + API (app), scan runner (worker) and database (db).
#
#   ./scripts/init-env.sh          # once: creates .env with a random database password and encryption key
#   docker compose up -d
#
# This file pulls the published image, so a server needs nothing but this file and .env. To build the image
# from a checkout instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Everything that must not be lost lives in one absolute folder of the host, DATA_PATH (the database is
# DATA_PATH/postgres). They are plain folders, never Docker volumes, so `docker compose down -v` and a prune
# cannot touch them. A relative DATA_PATH is resolved by whatever tool starts the stack, not by Docker.
#
# Shares are scanned read-only. The recommended route is to mount the NFS/SMB share on the
# Docker host and point NASSA_SHARES_DIR at the folder that holds the mounts; see docs/deploy.md.
# On a NAS that runs this stack itself, point NASSA_SHARES_DIR at the folder that holds its shares
# (Unraid: /mnt/user). Set NASSA_SHARES_MOUNT to the same path to type host paths in the interface.

name: nas-storage-analyzer

# The variables were called NASA_* before they were called NASSA_* (docs/adr/0012-nassa-environment-variables.md). Compose passes on only what is
# listed below, so a .env that still has the old names would read as "nothing set": NASSA_TAG would fall back to latest, whatever beta was chosen.
# This refuses instead and says what to do. The pattern is empty while the old variable is not set, and an error (the inner variable is
# never set) as soon as it is. The four are in every old .env: the two secrets, the shares folder and the channel.
x-nassa-renamed: "${NASA_DB_PASSWORD:+${NASSA_RENAME_THE_VARIABLES:?NASA_ variables are now NASSA_: rename them in .env, for example with sed -i 's/^NASA_/NASSA_/' .env}}${NASA_ENCRYPTION_KEY:+${NASSA_RENAME_THE_VARIABLES:?NASA_ variables are now NASSA_: rename them in .env}}${NASA_SHARES_DIR:+${NASSA_RENAME_THE_VARIABLES:?NASA_ variables are now NASSA_: rename them in .env}}${NASA_TAG:+${NASSA_RENAME_THE_VARIABLES:?NASA_ variables are now NASSA_: rename them in .env}}"

x-nasa: &nasa
  # NASSA_TAG is chosen in .env next to this file: latest (stable, the default), beta, or a version number to pin.
  # The same value goes into the container (below), so a beta build shows a beta label in the interface.
  image: ghcr.io/helmerznl/nas-storage-analyzer:${NASSA_TAG:-latest}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # A supplementary group, so the containers can read shares that only the owner and one group may read (Unraid:
  # nobody:users with mode 770, so NASSA_SHARES_GID=100). They keep their own uid. The default is the image's own
  # group, which changes nothing.
  group_add:
    - "${NASSA_SHARES_GID:-10001}"
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}
  volumes:
    # The scan target, read-only. NASSA_SHARES_DIR is an absolute path on the host (see docs/deploy.md): a
    # relative one is resolved by whatever tool starts the stack, and under Dockhand that is not the host.
    # It appears at NASSA_SHARES_MOUNT in the container (default /mnt/shares). Setting that to the same
    # value as NASSA_SHARES_DIR makes the paths in the interface identical to the paths on the host.
    # rprivate works on every host and shows the mounts that exist when the containers start. rslave
    # also shows mounts the host makes later (autofs), but Docker refuses it unless the host mount is
    # shared or slave ("not a shared or slave mount"), which is not the case on Unraid and many NAS systems.
    - type: bind
      source: ${NASSA_SHARES_DIR:?Set NASSA_SHARES_DIR in .env to the absolute folder of the host that holds the shares, e.g. /mnt/user}
      target: ${NASSA_SHARES_MOUNT:-/mnt/shares}
      read_only: true
      bind:
        propagation: ${NASSA_SHARES_PROPAGATION:-rprivate}
  environment: &nasa-env
    NASSA_TAG: ${NASSA_TAG:-latest}
    # The app does not use it; it is passed in so the container can warn when the value is relative.
    DATA_PATH: ${DATA_PATH:?Set DATA_PATH in .env to an absolute folder of the host, e.g. /srv/nas-storage-analyzer}
    NASSA_DB_HOST: db
    NASSA_DB_NAME: ${NASSA_DB_NAME:-nasa}
    NASSA_DB_USER: ${NASSA_DB_USER:-nasa}
    NASSA_DB_PASSWORD: ${NASSA_DB_PASSWORD:-}
    NASSA_ENCRYPTION_KEY: ${NASSA_ENCRYPTION_KEY:-}
    NASSA_TZ: ${NASSA_TZ:-Europe/Amsterdam}
    NASSA_SHARES_ROOT: ${NASSA_SHARES_MOUNT:-/mnt/shares}

services:
  app:
    <<: *nasa
    command: ["serve"]
    ports:
      - "${NASSA_HTTP_BIND:-127.0.0.1}:${NASSA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *nasa-env
      NASSA_SETUP_TOKEN: ${NASSA_SETUP_TOKEN:-}
      NASSA_RP_ID: ${NASSA_RP_ID:-}
      NASSA_RP_ORIGINS: ${NASSA_RP_ORIGINS:-}
      NASSA_PUBLIC_URL: ${NASSA_PUBLIC_URL:-}
      NASSA_RP_NAME: ${NASSA_RP_NAME:-NAS Storage Analyzer}
      NASSA_TRUSTED_PROXIES: ${NASSA_TRUSTED_PROXIES:-}
      NASSA_REQUIRE_HTTPS: ${NASSA_REQUIRE_HTTPS:-false}
      NASSA_METRICS_TOKEN: ${NASSA_METRICS_TOKEN:-}
      NASSA_UPDATE_CHECK: ${NASSA_UPDATE_CHECK:-true}
    healthcheck:
      test: ["CMD", "nasa", "healthcheck", "-url", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *nasa
    command: ["worker"]
    environment:
      <<: *nasa-env
      NASSA_WORKER_PARALLEL: ${NASSA_WORKER_PARALLEL:-2}
      NASSA_WORKER_HEALTH_LISTEN: 127.0.0.1:8081
    healthcheck:
      test: ["CMD", "nasa", "healthcheck", "-url", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${NASSA_DB_NAME:-nasa}
      POSTGRES_USER: ${NASSA_DB_USER:-nasa}
      POSTGRES_PASSWORD: ${NASSA_DB_PASSWORD:-}
    # Sizing for the queries on the aggregate tables: about 25% of RAM for shared_buffers and
    # 50-75% for effective_cache_size. The defaults suit a few million files; see docs/deploy.md.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - max_parallel_workers_per_gather=${PG_PARALLEL_WORKERS:-2}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.5}
    volumes:
      # The database is a folder on the host, never a Docker volume: it survives `docker compose down -v`, a prune
      # and every update. DATA_PATH is an absolute folder of the host (a relative one is resolved by the deploy tool).
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
