# NAS Storage Analyzer: web interface + API (app), scan runner (worker) and database (db).
#
#   ./scripts/init-env.sh          # once: creates .env with a random database password and encryption key
#   docker compose up -d
#
# This file pulls the published image, so a server needs nothing but this file and .env. To build the image
# from a checkout instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Everything that must not be lost lives in one absolute folder of the host, DATA_PATH (the database is
# DATA_PATH/postgres). They are plain folders, never Docker volumes, so `docker compose down -v` and a prune
# cannot touch them. A relative DATA_PATH is resolved by whatever tool starts the stack, not by Docker.
#
# Shares are scanned read-only. The recommended route is to mount the NFS/SMB share on the
# Docker host and point NASA_SHARES_DIR at the folder that holds the mounts; see docs/deploy.md.
# On a NAS that runs this stack itself, point NASA_SHARES_DIR at the folder that holds its shares
# (Unraid: /mnt/user). Set NASA_SHARES_MOUNT to the same path to type host paths in the interface.

name: nas-storage-analyzer

x-nasa: &nasa
  # NASA_TAG is chosen in .env next to this file: latest (stable, the default), beta, or a version number to pin.
  # The same value goes into the container (below), so a beta build shows a beta label in the interface.
  image: ghcr.io/helmerznl/nas-storage-analyzer:${NASA_TAG:-latest}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "5"}
  volumes:
    # The scan target, read-only. NASA_SHARES_DIR is an absolute path on the host (see docs/deploy.md): a
    # relative one is resolved by whatever tool starts the stack, and under Dockhand that is not the host.
    # It appears at NASA_SHARES_MOUNT in the container (default /mnt/shares). Setting that to the same
    # value as NASA_SHARES_DIR makes the paths in the interface identical to the paths on the host.
    # rprivate works on every host and shows the mounts that exist when the containers start. rslave
    # also shows mounts the host makes later (autofs), but Docker refuses it unless the host mount is
    # shared or slave ("not a shared or slave mount"), which is not the case on Unraid and many NAS systems.
    - type: bind
      source: ${NASA_SHARES_DIR:?Set NASA_SHARES_DIR in .env to the absolute folder of the host that holds the shares, e.g. /mnt/user}
      target: ${NASA_SHARES_MOUNT:-/mnt/shares}
      read_only: true
      bind:
        propagation: ${NASA_SHARES_PROPAGATION:-rprivate}
  environment: &nasa-env
    NASA_TAG: ${NASA_TAG:-latest}
    # The app does not use it; it is passed in so the container can warn when the value is relative.
    DATA_PATH: ${DATA_PATH:?Set DATA_PATH in .env to an absolute folder of the host, e.g. /srv/nas-storage-analyzer}
    NASA_DB_HOST: db
    NASA_DB_NAME: ${NASA_DB_NAME:-nasa}
    NASA_DB_USER: ${NASA_DB_USER:-nasa}
    NASA_DB_PASSWORD: ${NASA_DB_PASSWORD:-}
    NASA_ENCRYPTION_KEY: ${NASA_ENCRYPTION_KEY:-}
    NASA_TZ: ${NASA_TZ:-Europe/Amsterdam}
    NASA_SHARES_ROOT: ${NASA_SHARES_MOUNT:-/mnt/shares}

services:
  app:
    <<: *nasa
    command: ["serve"]
    ports:
      - "${NASA_HTTP_BIND:-127.0.0.1}:${NASA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *nasa-env
      NASA_SETUP_TOKEN: ${NASA_SETUP_TOKEN:-}
      NASA_RP_ID: ${NASA_RP_ID:-}
      NASA_RP_ORIGINS: ${NASA_RP_ORIGINS:-}
      NASA_RP_NAME: ${NASA_RP_NAME:-NAS Storage Analyzer}
      NASA_TRUSTED_PROXIES: ${NASA_TRUSTED_PROXIES:-}
      NASA_REQUIRE_HTTPS: ${NASA_REQUIRE_HTTPS:-false}
      NASA_METRICS_TOKEN: ${NASA_METRICS_TOKEN:-}
    healthcheck:
      test: ["CMD", "nasa", "healthcheck", "-url", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *nasa
    command: ["worker"]
    environment:
      <<: *nasa-env
      NASA_WORKER_PARALLEL: ${NASA_WORKER_PARALLEL:-2}
      NASA_WORKER_HEALTH_LISTEN: 127.0.0.1:8081
    healthcheck:
      test: ["CMD", "nasa", "healthcheck", "-url", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${NASA_DB_NAME:-nasa}
      POSTGRES_USER: ${NASA_DB_USER:-nasa}
      POSTGRES_PASSWORD: ${NASA_DB_PASSWORD:-}
    # Sizing for the queries on the aggregate tables: about 25% of RAM for shared_buffers and
    # 50-75% for effective_cache_size. The defaults suit a few million files; see docs/deploy.md.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - max_parallel_workers_per_gather=${PG_PARALLEL_WORKERS:-2}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.5}
    volumes:
      # The database is a folder on the host, never a Docker volume: it survives `docker compose down -v`, a prune
      # and every update. DATA_PATH is an absolute folder of the host (a relative one is resolved by the deploy tool).
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
