# Keep the database password and the encryption key out of the environment of the containers:
#
#   mkdir -p secrets && ./scripts/init-env.sh --secrets
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# (docker inspect and /proc/<pid>/environ show environment variables, not mounted secret files.)
# Leave NASA_DB_PASSWORD and NASA_ENCRYPTION_KEY out of .env when you use this file.
secrets:
  nasa_db_password:
    file: ./secrets/db_password
  nasa_encryption_key:
    file: ./secrets/encryption_key

services:
  db:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/nasa_db_password
    secrets: [nasa_db_password]
  app:
    environment:
      NASA_DB_PASSWORD_FILE: /run/secrets/nasa_db_password
      NASA_ENCRYPTION_KEY_FILE: /run/secrets/nasa_encryption_key
    secrets: [nasa_db_password, nasa_encryption_key]
  worker:
    environment:
      NASA_DB_PASSWORD_FILE: /run/secrets/nasa_db_password
      NASA_ENCRYPTION_KEY_FILE: /run/secrets/nasa_encryption_key
    secrets: [nasa_db_password, nasa_encryption_key]
